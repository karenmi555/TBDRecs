 try{
  const ms=await api("memberships?participant_id=eq."+encodeURIComponent(profile.id)+"&select=id,group_id,participant_id,display_name,role,created_at");
  const ids=ms.map(m=>m.group_id);let gs=[],rs=[],cs=[];
  if(ids.length){const q="("+ids.join(",")+")";[gs,rs]=await Promise.all([api("groups?id=in."+q+"&select=*"),api("recommendations?group_id=in."+q+"&select=*&order=created_at.desc")]);if(rs.length)cs=await api("comments?recommendation_id=in.("+rs.map(r=>r.id).join(",")+")&select=*&order=created_at.asc")}

  state.memberships=mergeMemberships(ms,state.memberships);state.groups=preserveLocal(gs,state.groups);state.recs=preserveLocal(rs,state.recs);state.comments=preserveLocal(cs,state.comments);online=true;schema="ready";

const SQL=`-- TBD Recommendations Option A schema
create extension if not exists pgcrypto;
create table if not exists public.groups (id uuid primary key default gen_random_uuid(), name text not null check(length(name) between 1 and 80), invite_code text not null unique, created_by uuid not null, created_at timestamptz not null default now());
create table if not exists public.memberships (id uuid primary key default gen_random_uuid(), group_id uuid not null references public.groups on delete cascade, participant_id uuid not null, display_name text not null check(length(display_name) between 1 and 60), role text not null default 'member' check(role in ('admin','member')), created_at timestamptz not null default now(), unique(group_id,participant_id));
create table if not exists public.recommendations (id uuid primary key default gen_random_uuid(), group_id uuid not null references public.groups on delete cascade, participant_id uuid not null, display_name text not null, title text not null check(length(title) between 1 and 120), category text not null check(category in ('book','movie','tv','restaurant','hotel','other')), city text, note text not null default '', created_at timestamptz not null default now(), updated_at timestamptz not null default now(), check(category not in ('restaurant','hotel') or length(trim(city))>0));
create table if not exists public.comments (id uuid primary key default gen_random_uuid(), recommendation_id uuid not null references public.recommendations on delete cascade, participant_id uuid not null, display_name text not null, body text not null check(length(body) between 1 and 400), created_at timestamptz not null default now());
alter table public.groups enable row level security; alter table public.memberships enable row level security; alter table public.recommendations enable row level security; alter table public.comments enable row level security;
create policy "anon groups" on public.groups for all to anon using(true) with check(true);
create policy "anon memberships" on public.memberships for all to anon using(true) with check(true);
create policy "anon recommendations" on public.recommendations for all to anon using(true) with check(true);
create policy "anon comments" on public.comments for all to anon using(true) with check(true);
create or replace function public.create_tbd_group(group_name text, participant uuid, member_name text)
returns setof public.groups language plpgsql security definer set search_path=public as $$ declare g public.groups; code text; begin code:=upper(substr(replace(gen_random_uuid()::text,'-',''),1,8)); insert into groups(name,invite_code,created_by) values(trim(group_name),code,participant) returning * into g; insert into memberships(group_id,participant_id,display_name,role) values(g.id,participant,trim(member_name),'admin'); return next g; end $$;
create or replace function public.join_tbd_group(code text, participant uuid, member_name text)
returns setof public.groups language plpgsql security definer set search_path=public as $$ declare g public.groups; begin select * into g from groups where invite_code=upper(trim(code)); if g.id is null then raise exception 'Invite code not found'; end if; insert into memberships(group_id,participant_id,display_name) values(g.id,participant,trim(member_name)) on conflict(group_id,participant_id) do update set display_name=excluded.display_name; return next g; end $$;
grant execute on function public.create_tbd_group(text,uuid,text) to anon; grant execute on function public.join_tbd_group(text,uuid,text) to anon;
grant select,insert,update,delete on public.groups,public.memberships,public.recommendations,public.comments to anon;
notify pgrst,'reload schema';`;

 <section class="panel"><h2>Supabase schema</h2><p>Copy this into Supabase → SQL Editor → New query, then run it once.</p><button class="btn" data-copy-sql>Copy SQL</button><details style="margin-top:14px" ${schema==="missing"?"open":""}><summary>View SQL</summary><textarea class="code" id="sqlText" readonly aria-label="Supabase setup SQL">${esc(SQL)}</textarea></details></section></div></main>`}

function zip(files){const local=[],central=[];let offset=0;Object.entries(files).forEach(([name,value])=>{const n=bytes(name),d=typeof value==="string"?bytes(value):value,crc=crc32(d),lh=new Uint8Array([...le(0x04034b50,4),...le(20,2),...le(0x800,2),...le(0,2),...le(0,2),...le(0,2),...le(crc,4),...le(d.length,4),...le(d.length,4),...le(n.length,2),...le(0,2),...n]),ch=new Uint8Array([...le(0x02014b50,4),...le(20,2),...le(20,2),...le(0x800,2),...le(0,2),...le(0,2),...le(0,2),...le(crc,4),...le(d.length,4),...le(d.length,4),...le(n.length,2),...le(0,2),...le(0,2),...le(0,2),...le(0,2),...le(0,4),...le(offset,4),...n]);local.push(lh,d);central.push(ch);offset+=lh.length+d.length});const size=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array([...le(0x06054b50,4),...le(0,2),...le(0,2),...le(central.length,2),...le(central.length,2),...le(size,4),...le(offset,4),...le(0,2)]);return new Blob([...local,...central,end])}

async function createGroup(name){
 const id=uuid(),g={id,name:name.trim(),invite_code:invite(),created_by:profile.id,created_at:now()},m={id:uuid(),group_id:id,participant_id:profile.id,display_name:profile.name,role:"admin",created_at:now()};
 if(online){try{const x=await api("rpc/create_tbd_group",{method:"POST",body:{group_name:name.trim(),participant:profile.id,member_name:profile.name}});g.id=x[0].id;g.invite_code=x[0].invite_code;g.created_at=x[0].created_at;m.group_id=g.id}catch(e){toast("Could not create group: "+friendly(e));return}}
 state.groups.push(g);state.memberships.push(m);active=g.id;persist();close();render();toast("Group created");if(online)sync();
}
async function joinGroup(code){
 const clean=code.trim().toUpperCase();let g=state.groups.find(x=>x.invite_code===clean);
 if(online&&!g){try{
  const groups=await api("groups?invite_code=eq."+encodeURIComponent(clean)+"&select=*&limit=1");g=groups[0];
  if(!g)throw new Error("Invite code not found. Your old groups may still exist, but you need their invite code to recover them.");
  const path="memberships?group_id=eq."+g.id+"&participant_id=eq."+profile.id,existing=await api(path+"&select=*");
  let membership=existing[0];
  if(membership){const updated=await api(path,{method:"PATCH",body:{display_name:profile.name}});membership=updated[0]||membership}
  else try{membership=(await api("memberships",{method:"POST",body:{id:uuid(),group_id:g.id,participant_id:profile.id,display_name:profile.name,role:"member",created_at:now()}}))[0]}catch(e){const raced=await api(path+"&select=*");if(!raced[0])throw e;membership=raced[0]}
  state.groups=preserveLocal([g],state.groups);state.memberships=mergeMemberships([membership],state.memberships);active=g.id;persist();close();await sync();toast("Group recovered and set active");return
 }catch(e){toast("Could not recover. Old groups may still exist; enter their invite code. "+friendly(e));return}}
 if(online){try{const x=await api("rpc/join_tbd_group",{method:"POST",body:{code:clean,participant:profile.id,member_name:profile.name}});close();active=x[0].id;await sync();toast("Group joined and set active");return}catch(e){toast("Could not join. Old groups may still exist; check the invite code. "+friendly(e));return}}
 if(!g){toast("Not available offline. Old groups may still exist; reconnect and enter the invite code.");return}if(!state.memberships.some(m=>m.group_id===g.id&&m.participant_id===profile.id))state.memberships.push({id:uuid(),group_id:g.id,participant_id:profile.id,display_name:profile.name,role:"member",created_at:now()});active=g.id;persist();close();render();toast("Group joined locally and set active");
}
function deleteRec(id){const r=state.recs.find(x=>x.id===id);if(!r||r.participant_id!==profile.id||!confirm(`Delete “${r.title}”?`))return;mutate(()=>api("recommendations?id=eq."+id+"&participant_id=eq."+profile.id,{method:"DELETE"}),()=>{state.recs=state.recs.filter(x=>x.id!==id);state.comments=state.comments.filter(c=>c.recommendation_id!==id)},"Recommendation deleted")}
document.addEventListener("click",async e=>{const safetyNow=e.target.closest?.("[data-safety-now]");if(safetyNow){safetyNow.disabled=true;const made=await createSafetyBackup("manual safety snapshot");render();toast(made?"Safety snapshot created":"Could not create safety snapshot");return}const safetyDownload=e.target.closest?.("[data-safety-download]");if(safetyDownload){downloadSafetyBackup(safetyDownload.dataset.safetyDownload);return}const safetyRestore=e.target.closest?.("[data-safety-restore]");if(safetyRestore){await restoreSafetyBackup(safetyRestore.dataset.safetyRestore);return}const template=e.target.closest?.("[data-template]");if(template){downloadTemplate(template.dataset.template);return}const backup=e.target.closest?.("[data-backup]");if(backup){downloadBackup();return}const importer=e.target.closest?.("[data-import]");if(importer){importModal();return}const exportButton=e.target.closest?.("[data-export-format]");if(exportButton){downloadExport(exportButton.dataset.exportFormat);return}const tab=e.target.closest?.("[data-tab]");if(tab){selectGroupTab(tab.dataset.tab);return}if(e.target.matches("[data-close]")||e.target.classList.contains("modal"))close()});document.addEventListener("keydown",e=>{if(e.key==="Escape")close();const tab=e.target.closest?.("[data-tab]");if(tab&&["ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();const tabs=all("[data-tab]",$("#modalRoot")),next=tabs[(tabs.indexOf(tab)+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length];selectGroupTab(next.dataset.tab);next.focus()}});document.addEventListener("change",async e=>{if(e.target.id==="recCat")toggleCity();if(e.target.id==="backupFile"){try{const data=await readBackup(e.target.files?.[0]);setImportStatus(`Ready to import ${data.recommendations.length} recommendation row${data.recommendations.length===1?"":"s"} from “${data.group.name||"Unnamed group"}”. Duplicate and row validation runs during import.`)}catch(err){setImportStatus(`Cannot import this file: ${friendly(e document.addEventListener("submit",async e=>{
 const f=new FormData(e.target);
 if(e.target.id==="createGroup"){e.preventDefault();createGroup(String(f.get("name")))};

 if(e.target.id==="commentForm"){e.preventDefault();const c={id:uuid(),recommendation_id:e.target.dataset.id,participant_id:profile.id,display_name:profile.name,body:String(f.get("body")).trim(),created_at:now()};await mutate(()=>api("comments",{method:"POST",body:c}),()=>{state.comments.push(c);detail(c.recommendation_id)},"Comment added")};
 if(e.target.id==="importForm"){e.preventDefault();const button=$("#importSubmit");if(button?.disabled)return;if(button)button.disabled=true;try{const data=await readBackup($("#backupFile")?.files?.[0]);setImportStatus("Creating a safety snapshot, then checking duplicates…");const snapshot=await createSafetyBackup("before Excel import");if(!snapshot)throw new Error("A safety snapshot could not be created; the import was not started");const summary=await importBackup(data,String(f.get("destination")||"current"));const message=`Import complete: ${summary.imported} added, ${summary.duplicates} duplicate${summary.duplicates===1?"":"s"} skipped, ${summary.invalid} invalid row${summary.invalid===1?"":"s"} skipped, ${summary.comments} comment${summary.comments===1?"":"s"} added${summary.commentFailures?`, ${summary.commentFailures} comments could not be added`:""}. A pre-import safety snapshot was saved.`;setImportStatus(message);toast(`${summary.imported} recommendations imported`);if(online)await sync()}catch(err){setImportStatus(`Import stopped: ${friendly(err)}. Items already added were kept; you can retry and duplicate protection will skip them.`);if(button)button.disabled=false}};
});

render();ensurePreUpdateBackup().then(snapshot=>{if(snapshot)toast(`Safety backup created · ${snapshot.summary.recommendations} recommendations protected`);const recover=safetyBackups().find(x=>snapshotHasData(x.data));if(!hasAppData(state)&&recover)modal("Restore your recommendations?",`<div class="notice"><strong>Your current browser data appears empty.</strong> An automatic safety backup from ${new Date(recover.data.created_at).toLocaleString()} contains ${recover.data.summary?.groups||0} group${recover.data.summary?.groups===1?"":"s"} and ${recover.data.summary?.recommendations||0} recommendation${recover.data.summary?.recommendations===1?"":"s"}.</div><p>Restore it with one click instead of starting with an empty database.</p><div class="actions"><button class="plain" data-close>Not now</button><button class="btn" data-safety-restore="${esc(recover.key)}">Restore backup</button></div>`);return sync()}).finally(()=>{if(window.ASOS_RUN&&typeof window.ASOS_COMPLETE==="function")window.ASOS_COMPLETE({summary:"TBD Recommendations Option A ready: Supabase friend groups with offline fallback, automatic safety backups, scoped recommendations and comments, exports, and setup SQL."})});
